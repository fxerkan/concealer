title: concealer
description: Local-only, single-file secret manager for the AI-coding era (SOPS + age).
remote_theme: just-the-docs/just-the-docs
baseurl: ""
url: "https://concealer.fxerkan.com"

logo: "/assets/logo.svg"
favicon_ico: "/assets/logo.svg"

# just-the-docs
color_scheme: concealer
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true

aux_links:
  "🏠 Home":
    - "https://concealer.fxerkan.com/"
  "GitHub":
    - "https://github.com/fxerkan/concealer"
  "Homebrew":
    - "https://github.com/fxerkan/homebrew-tap"
  "Support":
    - "mailto:concealer@fxerkan.com?subject=concealer%20support"
aux_links_new_tab: false

footer_content: 'Developed by <a href="https://fxerkan.com">FXerkan</a> — Code more, worry less. · MIT License'

# GitHub Pages / Jekyll
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache   # required by the just-the-docs theme

exclude:
  - Gemfile
  - Gemfile.lock
  - feature-plan.md   # internal roadmap — not published to GitHub Pages
  - assets/hero.html  # PNG render-source templates — not served
  - assets/icon.html
