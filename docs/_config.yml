title: concealer
description: Local-only, single-file secret manager for the AI-coding era (SOPS + age).
remote_theme: just-the-docs/just-the-docs
baseurl: "/concealer"
url: "https://fxerkan.github.io"

# just-the-docs
search_enabled: true
search:
  heading_level: 3
  previews: 3
color_scheme: dark
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/fxerkan/concealer"
aux_links_new_tab: true

footer_content: 'Developed by <a href="https://fxerkan.com">FXerkan</a> — Code more, worry less. MIT License.'

# GitHub Pages / Jekyll
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
