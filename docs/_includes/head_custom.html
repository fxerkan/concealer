<style>
  /* show the "concealer" wordmark next to the logo (just-the-docs hides the title when a logo is set) */
  .site-title{display:inline-flex!important;align-items:center;gap:10px;padding-left:12px}
  .site-title .site-logo{flex:0 0 auto;width:34px!important;height:34px!important;
    background-size:contain!important;background-position:center!important;background-repeat:no-repeat}
  .cer-wm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:20px;
    letter-spacing:-.3px;color:inherit}
  /* amber brand accent for the "er" suffix (house rule) */
  .cer-wm .ac,.site-title .ac{color:#0a0b0d;background:#ff4d4d;border-radius:4px;padding:0 .12em;margin-left:0}
  #cer-theme,#cer-lang{position:fixed;top:12px;z-index:2000;border:1px solid #2a2f38;
    background:#161a20;color:#e8e8e6;border-radius:8px;height:32px;padding:0 12px;font-size:13px;
    font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #cer-theme{right:14px}#cer-lang{right:96px}
  #cer-theme:hover,#cer-lang:hover{border-color:#ff4d4d}
  @media(max-width:800px){#cer-theme{top:auto;bottom:12px}#cer-lang{top:auto;bottom:12px}}
  /* platform tabs (macOS/Linux · Windows · Chrome Extension) — used across install docs */
  .cer-tabs{border:1px solid #2a2f38;border-radius:10px;overflow:hidden;margin:18px 0;background:#101216}
  .cer-tabbar{display:flex;flex-wrap:wrap;background:#161a20;border-bottom:1px solid #2a2f38}
  .cer-tab{flex:1;min-width:150px;border:0;background:transparent;color:#8a909b;padding:11px 14px;
    font:inherit;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
  .cer-tab:hover{color:#e8e8e6}
  .cer-tab.is-active{color:#ff4d4d;border-bottom-color:#ff4d4d;background:#101216}
  .cer-panel{display:none;padding:6px 18px 10px}
  .cer-panel.is-active{display:block}
  html[data-cer-theme="light"] .cer-tabs{border-color:#e2e6eb;background:#fff}
  html[data-cer-theme="light"] .cer-tabbar{background:#eef0f3;border-bottom-color:#e2e6eb}
  html[data-cer-theme="light"] .cer-tab{color:#5b6472}
  html[data-cer-theme="light"] .cer-tab:hover{color:#1a1d23}
  html[data-cer-theme="light"] .cer-tab.is-active{color:#c47a00;border-bottom-color:#c47a00;background:#fff}
  /* primary "Add to Chrome" call-to-action button (Web Store install) */
  .btn-cws{display:inline-block;background:#ff4d4d;color:#0a0b0d!important;font-weight:700;
    text-decoration:none;border-radius:9px;padding:11px 20px;font-size:15px;
    box-shadow:0 4px 14px rgba(255,77,77,.35)}
  .btn-cws:hover{background:#ff6363;color:#0a0b0d!important}
</style>
<script>
/* Docs enhancements: wordmark, dark/light toggle, and an EN/TR language toggle.
   Theme stylesheets are just-the-docs-default.css (amber "dark") and just-the-docs-light.css,
   so theme names must be 'default'/'light'. Turkish pages live under /concealer/tr/<slug>.html;
   on those pages we rewrite the shared sidebar to Turkish (labels + /tr/ hrefs) so the nav config
   is never duplicated. NOTE: block comments only — this include is minified onto one line; a //
   comment would swallow the rest of the script. */
(function(){
  var NAV={
    "Getting Started":"Başlarken","Installation":"Kurulum","Concepts":"Kavramlar",
    "CLI Reference":"CLI Referansı","Secret Types":"Secret Türleri","Web UI":"Web Arayüzü",
    "Chrome Extension":"Chrome Eklentisi",
    "Risks":"Riskler","Policy":"Politika",
    "TUI":"TUI","MCP for AI Agents":"AI Ajanları için MCP","Tokens & Recovery":"Token'lar & Kurtarma",
    "Security Model":"Güvenlik Modeli","Portability & Backup":"Taşınabilirlik & Yedekleme",
    "Comparison":"Karşılaştırma","🏠 Home":"🏠 Ana Sayfa"
  };
  function isTR(){return location.pathname.indexOf('/concealer/tr/')===0;}
  function counterpart(){
    var p=location.pathname;
    return isTR()?p.replace('/concealer/tr/','/concealer/'):p.replace('/concealer/','/concealer/tr/');
  }
  function wordmark(){
    var st=document.querySelector('.site-title');
    if(st&&!st.querySelector('.cer-wm')){var w=document.createElement('span');w.className='cer-wm';w.innerHTML='conceal<span class="ac">er</span>';st.appendChild(w);}
  }
  function trSidebar(){
    if(!isTR())return;
    document.querySelectorAll('.site-nav a.nav-list-link, .aux-nav-list a.site-button').forEach(function(a){
      var t=a.textContent.trim();
      if(NAV[t])a.textContent=NAV[t];
      var h=a.getAttribute('href')||'';
      if(h.indexOf('/concealer/')===0 && h.indexOf('/concealer/tr/')!==0 && h.indexOf('github')<0 && !a.classList.contains('site-button'))
        a.setAttribute('href',h.replace('/concealer/','/concealer/tr/'));
    });
    var si=document.getElementById('search-input');if(si)si.placeholder="concealer'da ara";
  }
  /* Copy button → command only: strip trailing inline "# ..." comments so a pasted line runs clean.
     Only the theme's copy button uses clipboard.writeText; text-selection (Ctrl-C) uses the copy
     event and is left untouched. Conservative: needs content + space before "# " → keeps shebangs
     (#!...), full-line # comments, and URL fragments (http://x#y). */
  function stripInlineComments(t){
    return t.split('\n').map(function(l){
      return l.replace(/^(.*\S)[ \t]+#[ \t].*$/, '$1');
    }).join('\n');
  }
  function cleanCopy(){
    if(!navigator.clipboard||!navigator.clipboard.writeText)return;
    var orig=navigator.clipboard.writeText.bind(navigator.clipboard);
    navigator.clipboard.writeText=function(t){
      try{if(typeof t==='string')t=stripInlineComments(t);}catch(e){}
      return orig(t);
    };
  }
  /* platform tabs: clicking a tab switches every tab group that has that key, and remembers it. */
  function tabs(){
    function activate(group,key){
      group.querySelectorAll('.cer-tab').forEach(function(b){b.classList.toggle('is-active',b.dataset.tab===key);});
      group.querySelectorAll('.cer-panel').forEach(function(p){p.classList.toggle('is-active',p.dataset.panel===key);});
    }
    var groups=document.querySelectorAll('.cer-tabs');if(!groups.length)return;
    var saved=localStorage.getItem('cer_platform');
    if(saved!=='mac'&&saved!=='win'&&saved!=='ext')saved=/win/i.test((navigator.platform||navigator.userAgent))?'win':'mac';
    groups.forEach(function(group){
      var keys=[].map.call(group.querySelectorAll('.cer-tab'),function(b){return b.dataset.tab;});
      if(keys.indexOf(saved)>=0)activate(group,saved);
      group.querySelectorAll('.cer-tab').forEach(function(b){
        b.addEventListener('click',function(){
          var key=b.dataset.tab;localStorage.setItem('cer_platform',key);
          document.querySelectorAll('.cer-tabs').forEach(function(g){
            if([].some.call(g.querySelectorAll('.cer-tab'),function(x){return x.dataset.tab===key;}))activate(g,key);
          });
        });
      });
    });
  }
  function init(){
    if(document.getElementById('cer-theme'))return;
    if(!document.body){setTimeout(init,50);return;}
    wordmark();trSidebar();cleanCopy();tabs();
    /* theme */
    var tb=document.createElement('button');tb.id='cer-theme';document.body.appendChild(tb);
    var cur=localStorage.getItem('cer_docs_theme');if(cur!=='light'&&cur!=='default')cur='default';
    function paint(){tb.textContent=(cur==='light')?'☀️ Light':'🌙 Dark';}
    function apply(t){cur=t;if(window.jtd&&jtd.setTheme)jtd.setTheme(t);document.documentElement.setAttribute('data-cer-theme',t);localStorage.setItem('cer_docs_theme',t);paint();}
    paint();
    (function ready(n){if(window.jtd&&jtd.setTheme){apply(cur);}else if(n>0){setTimeout(function(){ready(n-1);},50);}})(60);
    tb.onclick=function(){apply(cur==='light'?'default':'light');};
    /* language */
    var lb=document.createElement('button');lb.id='cer-lang';document.body.appendChild(lb);
    lb.textContent=isTR()?'🌐 TR':'🌐 EN';
    lb.title=isTR()?'Switch to English':'Türkçe’ye geç';
    lb.onclick=function(){localStorage.setItem('cer_docs_lang',isTR()?'en':'tr');location.href=counterpart();};
  }
  init();
})();
</script>
