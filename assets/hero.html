<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box}
  .hero{width:1280px;height:640px;position:relative;overflow:hidden;
    background:radial-gradient(900px 520px at 84% -14%,#181a12 0%,#101116 40%,#0a0b0d 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#e8e8e6}
  /* faint redacted-document texture: dim bars in the clear top-right band */
  .lines{position:absolute;right:64px;top:40px;width:440px;opacity:.6}
  .lines i{display:block;height:16px;border-radius:8px;background:#14171d;margin-bottom:16px}
  .lines i:nth-child(1){width:70%}.lines i:nth-child(2){width:92%}
  .lines i:nth-child(3){width:58%}.lines i:nth-child(4){width:80%}.lines i:nth-child(5){width:44%}
  .wrap{position:relative;z-index:2;padding:96px 90px;display:flex;flex-direction:column;height:100%;justify-content:center}
  .row{display:flex;align-items:center;gap:26px}
  .mark{width:120px;height:120px;filter:drop-shadow(0 14px 34px rgba(255,176,32,.28))}
  h1{font-size:96px;margin:0;font-weight:700;letter-spacing:-3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  h1 .ac{display:inline-block;color:#0a0b0d;background:#ffb020;border-radius:12px;padding:0 .12em;margin-left:.04em;
    box-shadow:0 8px 26px rgba(255,176,32,.30)}
  .sub{margin:30px 0 0;font-size:30px;color:#e8e8e6;font-weight:600}
  .tag{margin:14px 0 0;font-size:21px;color:#8a909b;font-weight:500}
  .cli{margin:30px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;color:#8a909b;
    display:inline-flex;align-items:center;gap:10px;padding:12px 18px;background:#101216;border:1px solid #1c1f26;border-radius:12px;width:fit-content}
  .cli b{color:#ffb020;font-weight:600}
  .chips{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
  .chip{font-size:18px;padding:9px 18px;border-radius:22px;background:#101216;border:1px solid #1c1f26;color:#b9bdc6}
  .chip b{color:#ffb020;font-weight:600}
</style></head>
<body>
<div class="hero">
  <div class="lines"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="wrap">
    <div class="row">
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="116" fill="#0a0b0d"/>
        <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#20242c" stroke-width="2"/>
        <rect x="128" y="176" width="176" height="38" rx="19" fill="#272c35"/>
        <rect x="128" y="232" width="256" height="52" rx="26" fill="#ffb020"/>
        <rect x="128" y="302" width="136" height="38" rx="19" fill="#272c35"/>
      </svg>
      <h1>conceal<span class="ac">er</span></h1>
    </div>
    <p class="sub">Local-only secret manager over SOPS + age</p>
    <p class="tag">Typed secrets · scopes · web UI · MCP server · tamper-evident audit</p>
    <p class="cli">$ <b>cer</b> web<span style="color:#2a2f38">&nbsp;·&nbsp;</span><b>cer</b> add<span style="color:#2a2f38">&nbsp;·&nbsp;</span><b>cer</b> run</p>
    <div class="chips">
      <span class="chip"><b>◼</b> encrypted vault</span>
      <span class="chip"><b>◼</b> deploy to AWS / k8s / env</span>
      <span class="chip"><b>◼</b> leak detection</span>
      <span class="chip"><b>◼</b> HMAC audit chain</span>
    </div>
  </div>
</div>
</body></html>
